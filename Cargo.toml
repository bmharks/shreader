[package]
name = "rss_reader"
version = "0.1.0"
edition = "2024"

[dependencies]
# Storage & Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Feed parsing & HTTP
feed-rs = "1.5"
quick-xml = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Dates, URLs, hashing & HTML
chrono = "0.4"
url = "2.5"
sha2 = "0.10"
hex = "0.4"
html2text = "0.13"

# System & Linux XDG paths
directories = "5.0"

# Error handling & logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# GUI
iced = { version = "0.13", features = ["tokio", "svg", "image", "advanced"] }
# Same version iced uses; story images are decoded in the background with it
image = "0.24"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
libc = "0.2"
# Downloads several feeds at once during a refresh
futures = "0.3"

# Optimise dependencies even in debug builds. Image decoding, HTML conversion,
# text layout and SQLite are 10-50x slower unoptimised, which made the UI
# freeze on image-heavy stories. Our own crate stays at opt-level 0, so
# rebuilding after an edit is still fast.
[profile.dev.package."*"]
opt-level = 3
