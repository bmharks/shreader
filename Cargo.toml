[package]
name = "rss_reader"
version = "0.1.0"
edition = "2024"

[dependencies]
# Storage & Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Feed parsing & HTTP
feed-rs = "1.5"
quick-xml = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Data & serialization
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
sha2 = "0.10"
hex = "0.4"
html2text = "0.13"

# System & Linux XDG paths
directories = "5.0"

# Error handling & logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# GUI
iced = { version = "0.13", features = ["tokio", "svg", "image", "advanced"] }
