[package]
name = "shreader"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An RSS and Atom reader for Linux that keeps every story it receives, in a searchable local archive"
authors = ["bmharks <bmharks@gmail.com>"]
license = "MIT"
repository = "https://github.com/bmharks/shreader"
homepage = "https://github.com/bmharks/shreader"
readme = "README.md"
keywords = ["rss", "atom", "feed-reader", "archive", "linux"]
categories = ["gui"]

[dependencies]
# Storage & Database
rusqlite = { version = "0.41.1", features = ["bundled", "chrono"] }

# Feed parsing & HTTP
feed-rs = "2.4"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Dates, URLs, hashing & HTML
chrono = "0.4"
url = "2.5"
sha2 = "0.10"
hex = "0.4"
html2text = "0.13"

# System & Linux XDG paths
directories = "5.0"

# Error handling & logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# GUI
iced = { version = "0.13", features = ["tokio", "svg", "image", "advanced"] }
# Same version iced uses; story images are decoded in the background with it
image = "0.24"
# Story embeddings: a small language model (all-MiniLM-L6-v2) that turns a
# headline into numbers capturing its meaning, for grouping stories. Pure Rust;
# the tokenizer without its default C regex library (BERT models don't need it)
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
tokenizers = { version = "=0.23.2", default-features = false }
serde_json = "1"
# Embeddings are stored as 16-bit floats (half the size, no loss that matters)
half = "2"
# To check for a Vulkan GPU at startup (same version iced uses)
wgpu = "0.19"
# System tray icon (StatusNotifierItem, as used by KDE), for running in the background
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
# Only one copy runs: a second one asks the first over D-Bus to show its window
# (the zbus version ksni and the file dialogs already use)
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Draws story SVGs into images in the background (same version and features
# iced uses, so nothing extra is compiled)
resvg = { version = "0.42", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
libc = "0.2"
# Downloads several feeds at once during a refresh
futures = "0.3"

# Optimise dependencies even in debug builds. Image decoding, HTML conversion,
# text layout and SQLite are 10-50x slower unoptimised, which made the UI
# freeze on image-heavy stories. Our own crate stays at opt-level 0, so
# rebuilding after an edit is still fast.
[profile.dev.package."*"]
opt-level = 3
