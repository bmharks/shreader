[package]
name = "shreader-tags"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Tags for Shreader: models that sort stories (promotions, security news...) into views of their own"
license = "MIT"
publish = false

[dependencies]
# The same SQLite as Shreader (both open the archive)
rusqlite = { version = "0.41.1", features = ["bundled", "chrono"] }
anyhow = "1.0"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
# Story embeddings: a small language model (all-MiniLM-L6-v2) run on the CPU
# in pure Rust, and the training of tag models. The tokenizer without its
# default C regex library (BERT models don't need it)
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
tokenizers = { version = "=0.23.2", default-features = false }
serde_json = "1"
# Embeddings are stored as 16-bit floats (half the size, no loss that matters)
half = "2"
